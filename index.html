<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Painel de Prestação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (max 960px); cabeçalho com saldo em destaque, entrada rápida, conteúdo por abas; no celular, barra de navegação inferior. Tema claro único, por pedido do usuário. */
:root{
  color-scheme: light;
  --bg:#ffffff; --ink:#101828; --muted:#5d6b82; --line:#e8ebf2; --soft:#f5f7fb;
  --brand:#ff4f2e; --brand2:#ffa21f; --brand-soft:#fff1ec;
  --ok:#0fa968; --ok-bg:#e3f8ee; --warn:#e98a00; --warn-bg:#fff4dc; --bad:#ec3a2f; --bad-bg:#ffe9e7; --gray:#7a869a; --gray-bg:#eef1f6;
  --c-diarias:#2f6bff; --c-consumo:#10b981; --c-passagens:#06aed4; --c-servpf:#f59e0b; --c-servpj:#ec4899; --c-equip:#7c4dff;
  --f-disp:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:1.5rem;font-weight:800} h2{font-size:1.25rem;font-weight:700} h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.right{text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}

.appbar{padding-block:14px 10px}
.appbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar .wrap+.wrap{display:block}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1rem;flex:none;box-shadow:0 6px 16px -6px var(--brand)}
.brand-txt{min-width:0}
.brand-txt b{font-family:var(--f-disp);font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{font-size:.75rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:.75rem;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:#a35f00} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-gray{background:var(--gray-bg);color:var(--gray)}
.banner{border-radius:12px;padding:12px 14px;font-size:.88rem;margin-top:10px}
.banner.warn{background:var(--warn-bg);color:#6b4100} .banner.bad{background:var(--bad-bg);color:#8f1d16} .banner.info{background:var(--soft);color:var(--muted)}

.hero{border-radius:24px;padding:22px;background:linear-gradient(125deg,#ff4f2e 0%,#ff7a1f 55%,#ffb21f 100%);color:#fff;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;box-shadow:0 18px 40px -22px rgba(255,79,46,.75);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.88)}
.hero .big{font-family:var(--f-disp);font-size:clamp(2rem,7vw,3rem);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .sub{font-size:.85rem;opacity:.92}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero-stat{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px}
.hero-stat small{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.92}
.hero-stat b{font-variant-numeric:tabular-nums;font-size:1rem}
.ring{width:118px;height:118px;position:relative;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:1.5rem;line-height:1}
.ring .lbl small{display:block;font-family:var(--f-body);font-size:.65rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.92;margin-top:3px}
@media (max-width:560px){.hero{grid-template-columns:1fr;padding:18px}.ring{position:absolute;right:14px;top:14px;width:76px;height:76px}.ring .lbl{font-size:1rem}.ring .lbl small{font-size:.55rem}}

.entry{padding-block:16px 4px}
.entry-box{border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);box-shadow:var(--shadow);transition:border-color .2s}
.entry-box:focus-within{border-color:var(--brand)}
.entry textarea{border:0;resize:vertical;min-height:56px;outline:none;width:100%;background:transparent;font-size:1rem}
.entry .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:#b8321a;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 16px;font-weight:700;min-height:44px;transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{background:var(--soft)} .btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),#ff6a24);border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px var(--brand)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.cam{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.cam:hover{background:#273248}
.btn.danger{color:var(--bad);border-color:#f7c3be}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 12px;min-height:34px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--brand);padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:.8rem;color:var(--muted)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:14px}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:700;border-radius:12px;white-space:nowrap;font-size:.92rem;transition:background .15s,color .15s}
.tabs a:hover{background:var(--soft);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--ink);color:#fff}
@media (max-width:720px){
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs .wrap{justify-content:space-around;padding-block:6px;gap:0}
  .tabs a{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 4px;border-radius:10px;min-width:58px}
  .tabs a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}
main{padding-block:22px 64px}
section.block{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.states{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.states{grid-template-columns:repeat(2,minmax(0,1fr))}}
.state{border-radius:18px;padding:14px;text-align:left;border:0;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.state:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.state .top{display:flex;justify-content:space-between;align-items:center}
.state b{font-family:var(--f-disp);font-size:2rem;font-weight:800;line-height:1}
.state span{font-size:.8rem;font-weight:700}
.state .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.7)}
.st-pendente{background:var(--warn-bg);color:#8a5200}
.st-comprovada{background:var(--ok-bg);color:#077a4b}
.st-irregular{background:var(--bad-bg);color:#b8241b}
.st-fapemat{background:var(--gray-bg);color:#4d586b}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

.deadline{border-radius:20px;padding:18px;background:var(--ink);color:#fff;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.deadline .eyebrow{color:#aab4c5}
.deadline .days{font-family:var(--f-disp);font-size:3rem;font-weight:800;line-height:1;color:var(--brand2);font-variant-numeric:tabular-nums}
.deadline .days small{display:block;font-size:.8rem;color:#d7deea;font-family:var(--f-body);font-weight:600;text-align:right}
.timeline{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:4px;transform-origin:left}
.dl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.dl-list{grid-template-columns:1fr}}
.dl{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.dl b{font-family:var(--f-disp);font-size:1.2rem;white-space:nowrap}
.dl.vencido{opacity:.55}
.dl.urg b{color:var(--bad)}

.rub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.rub-grid{grid-template-columns:1fr}}
.rub{border-radius:18px;border:1.5px solid var(--line);padding:16px 16px 16px 22px;display:flex;flex-direction:column;gap:10px;background:var(--bg);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.rub:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rub::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.rub .tag{align-self:flex-start;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);padding:3px 8px;border-radius:6px}
.rub .avail{font-family:var(--f-disp);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.rub .avail.neg{color:var(--bad)}
.bar{height:12px;border-radius:6px;background:var(--soft);display:flex;overflow:hidden}
.bar i{display:block;height:100%;transform-origin:left}
.anim .bar i,.anim .track i,.anim .mini i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar .g{background:var(--ok)} .bar .p{background:var(--warn)} .bar .x{background:var(--bad)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:.74rem;color:var(--muted)}
.legend div{display:flex;flex-direction:column}
.legend .num{color:var(--ink);font-size:.84rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}

.filters{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
@media (max-width:560px){.filters{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
select,input[type=text],input[type=date],input:not([type]),textarea.f{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);min-height:44px;width:100%;min-width:0;transition:border-color .15s}
select:focus,input:focus,textarea.f:focus{border-color:var(--brand);outline:none}
textarea.f{min-height:70px;resize:vertical}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);transition:box-shadow .15s}
.item:hover{box-shadow:var(--shadow)}
.item.irr{border-color:#f7c3be}
.item-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px;width:100%;text-align:left;background:none;border:0;align-items:start}
.item-head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-disp);font-weight:800;font-size:.85rem}
.item-head .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.item-head .title{font-weight:700;overflow-wrap:anywhere}
.item-head .sub{font-size:.78rem;color:var(--muted)}
.item-head .val{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item-head .val .num{font-size:1.02rem}
@media (max-width:480px){.item-head{grid-template-columns:auto 1fr}.item-head .val{grid-column:2;flex-direction:row;justify-content:space-between;align-items:center}}
.missing{font-size:.78rem;color:#8a5200;font-weight:600}
.missing.bad{color:var(--bad)}
.detail{padding:14px 14px 18px;display:flex;flex-direction:column;gap:14px;border-top:1.5px dashed var(--line)}

.alert{border-radius:12px;padding:12px 14px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.alert.bad{background:var(--bad-bg);color:#7d1712} .alert.gray{background:var(--gray-bg);color:#384152} .alert.warn{background:var(--warn-bg);color:#5e3a00} .alert.ok{background:var(--ok-bg);color:#0b5a39}
.alert b{font-weight:700}
.alert .norma{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ok-bg);color:#0b5a39;font-size:.86rem;flex-wrap:wrap;font-weight:600}
.doc.missing-doc{background:var(--warn-bg);color:#6b4100}
.doc.opt{background:var(--bg);color:var(--muted);border:1.5px dashed var(--line)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:.76rem;color:var(--muted);font-weight:700}
.fld.vazio input,.fld.vazio select,.fld.vazio textarea{border-color:var(--warn);background:var(--warn-bg)}
.fld.vazio>span::after{content:" · não lido, preencha";color:var(--warn)}
.editform .fld.vazio>span::after{content:" · preencha"}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.check input{margin-top:4px;min-height:auto;width:auto;accent-color:var(--brand)}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset[inert] input,fieldset[inert] select,fieldset[inert] textarea{border-color:transparent;background:var(--soft);appearance:none}

#drafts{display:flex;flex-direction:column;gap:14px}
.card{border:1.5px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.card.draft{border:2px solid var(--brand);box-shadow:0 14px 34px -18px rgba(255,79,46,.55);animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.4}}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.quote{font-size:.9rem;color:var(--muted);border-left:4px solid var(--brand2);padding-left:10px;overflow-wrap:anywhere}
.card-foot{display:flex;gap:8px;flex-wrap:wrap}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:.88rem}
.choice:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.choice input{margin-top:4px;accent-color:var(--brand)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
td.r,th.r{text-align:right}
.ext td input,.ext td select{min-height:36px;padding:4px 8px;font-size:.84rem;border-radius:8px}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

.budget{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.b-row{display:grid;grid-template-columns:1fr 112px 112px 112px;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:.88rem;align-items:center}
.b-row:last-child{border-bottom:0}
.b-row.h{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--soft)}
.b-row .q{font-size:.75rem;color:var(--muted)}
.b-row .neg{color:var(--bad)}
.mini{height:5px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);transform-origin:left}
@media (max-width:560px){.b-row{grid-template-columns:1fr 1fr 1fr}.b-row>div:first-child{grid-column:1/-1}.b-row.h{display:none}.b-row .lbl{display:block;font-size:.66rem;color:var(--muted);font-weight:700}}
@media (min-width:561px){.b-row .lbl{display:none}}

.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--brand),#ff6a24);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1}

.gate{display:grid;place-items:center;padding-block:28px}
.gate .card{max-width:460px;width:100%;gap:16px;box-shadow:var(--shadow)}
.gate .logo{width:56px;height:56px;border-radius:16px;font-size:1.4rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:.88rem;font-weight:600;max-width:min(92vw,560px);z-index:40;box-shadow:0 12px 30px rgba(16,24,40,.3)}

"use strict";
/* ================= PLANO DE TRABALHO (carregado do banco, nunca embutido no código) ================= */
let PROJ=null,RUBRICAS=[],RUB={},ITENS=[],ITEM={},EQUIPE=[],PRAZOS=[];
function validarPlano(p){
  const e=[];
  if(!p||p.formato!=="plano-fapemat-v1"){e.push("formato não reconhecido (esperado plano-fapemat-v1)");return e}
  const P=p.projeto||{};
  ["nome","processo","coordenador","vigenciaInicio","vigenciaFim","totalCentavos","custeioCentavos","capitalCentavos","diariaDentroUfCentavos","diariaForaUfCentavos"].forEach(k=>{if(P[k]==null||P[k]==="")e.push("projeto."+k+" ausente")});
  if(!Array.isArray(p.rubricas)||!p.rubricas.length)e.push("rubricas ausentes");
  if(!Array.isArray(p.itens)||!p.itens.length)e.push("itens ausentes");
  else p.itens.forEach(i=>{if(!i.id||!i.rubrica||!(i.quantidade>0)||!(i.unitarioCentavos>=0))e.push("item inválido: "+(i.nome||i.id))});
  return e;
}
function aplicarPlano(p){
  const P=p.projeto;
  PROJ={nome:P.nome,nomeCurto:P.nomeCurto||P.nome,processo:P.processo,edital:P.edital||"",coord:P.coordenador,inst:P.instituicao||"",sede:P.sede||"",vigIni:P.vigenciaInicio,vigFim:P.vigenciaFim,norma:P.norma||"Resolução Normativa FAPEMAT 008/2021",total:P.totalCentavos,custeio:P.custeioCentavos,capital:P.capitalCentavos,diariaDentro:P.diariaDentroUfCentavos,diariaFora:P.diariaForaUfCentavos,uf:P.ufSede||"MT"};
  RUBRICAS=p.rubricas.map(r=>({id:r.id,nome:r.nome,natureza:r.natureza,aprovado:r.aprovadoCentavos}));
  RUB=Object.fromEntries(RUBRICAS.map(r=>[r.id,r]));
  ITENS=p.itens.map(i=>({rubrica:i.rubrica,id:i.id,nome:i.nome,qtd:i.quantidade,unid:i.unidade||"",unit:i.unitarioCentavos,total:Math.round(i.quantidade*i.unitarioCentavos),destino:i.destino,uf:i.uf,generica:!!i.generica}));
  ITEM=Object.fromEntries(ITENS.map(i=>[i.id,i]));
  EQUIPE=p.equipe||[];
  PRAZOS=(p.prazos||[]).map(x=>[x.data,x.nome]).sort((a,b)=>a[0].localeCompare(b[0]));
  document.getElementById("brandNome").textContent=PROJ.nomeCurto;
  document.getElementById("brandSub").textContent=PROJ.processo;
}
const COR_RUB={diarias:"var(--c-diarias)",consumo:"var(--c-consumo)",passagens:"var(--c-passagens)",servpf:"var(--c-servpf)",servpj:"var(--c-servpj)",equip:"var(--c-equip)"};

const TIPOS={
 consumo:{nome:"Material de consumo",sigla:"MC",rubrica:"consumo",natureza:"custeio",docs:["nf","comprovante"]},
 servico_pj:{nome:"Serviço de pessoa jurídica",sigla:"PJ",rubrica:"servpj",natureza:"custeio",docs:["nf","comprovante"],orc:true,servico:true},
 servico_pf:{nome:"Serviço de pessoa física",sigla:"PF",rubrica:"servpf",natureza:"custeio",docs:["recibo_pf","comprovante"],orc:true,servico:true},
 diaria:{nome:"Diária",sigla:"DI",rubrica:"diarias",natureza:"custeio",docs:["recibo_diaria","comprovante"]},
 passagem:{nome:"Passagem aérea",sigla:"PA",rubrica:"passagens",natureza:"custeio",docs:["bilhete","fatura","embarque"]},
 equipamento:{nome:"Equipamento / material permanente",sigla:"EQ",rubrica:"equip",natureza:"capital",docs:["nf","comprovante","termo"],orc:true},
 taxa_bancaria:{nome:"Taxa bancária da conta do projeto",sigla:"TB",rubrica:null,natureza:"custeio",docs:["extrato"]}};
const DOCS={nf:"Nota fiscal",comprovante:"Comprovante de pagamento",recibo_pf:"Recibo de Serviços de Terceiros Pessoa Física",recibo_diaria:"Recibo de Diária",bilhete:"Bilhete eletrônico",fatura:"Fatura da agência ou companhia",embarque:"Comprovante de embarque",termo:"Termo de incorporação ao patrimônio",orcamento:"Orçamento (cotação)",extrato:"Lançamento no extrato da conta do projeto",outro:"Outro documento"};

const digits=s=>String(s||"").replace(/\D/g,"");
const BRLF=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const NUMF=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=c=>c==null?"—":BRLF.format(c/100);
const numBR=c=>c==null?"":NUMF.format(c/100);
const pad=n=>String(n).padStart(2,"0");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtData=iso=>iso?iso.split("-").reverse().join("/"):"sem data";
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const isoUTC=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const diasEntre=(a,b)=>Math.round((isoUTC(b)-isoUTC(a))/864e5);
const fmtQtd=q=>q==null?"":String(q).replace(".",",");
function parseValor(t){
  if(t==null||t==="")return null;
  if(typeof t==="number")return isFinite(t)?Math.round(t*100):null;
  let s=String(t).replace(/R\$|\s/g,"");
  if(!/\d/.test(s))return null;
  const neg=/^-/.test(s)||/-$/.test(s);
  s=s.replace(/[^\d.,]/g,"");
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,"");
  const n=Number(s);
  if(!isFinite(n))return null;
  return Math.round(n*100)*(neg?-1:1);
}
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function parseData(t){
  if(!t)return null;
  const s=norm(t);let d,mo,y,m;
  if((m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))){y=+m[1];mo=+m[2];d=+m[3]}
  else if((m=s.match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/))){d=+m[1];mo=+m[2];y=m[3]?+m[3]:null}
  else if((m=s.match(/(\d{1,2})\s*(?:de\s*)?([a-z]{3})[a-z]*\.?(?:\s*(?:de\s*)?(\d{4}))?/))&&MESES.includes(m[2])){d=+m[1];mo=MESES.indexOf(m[2])+1;y=m[3]?+m[3]:null}
  else return null;
  if(!(mo>=1&&mo<=12&&d>=1&&d<=31))return null;
  if(!y)return{parcial:true,d,mo};
  if(y<100)y+=2000;
  const dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCMonth()!==mo-1)return null;
  return{iso:`${y}-${pad(mo)}-${pad(d)}`};
}
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms||4200)}

/* ================= ARMAZENAMENTO =================
   (1) Dentro do Claude: banco do artifact. (2) Fora dele, com firebase-config.js: Firestore com login Google,
   dados em users/{uid}/... (as regras em firestore.rules só deixam cada conta ler e gravar a própria pasta).
   (3) Sem nada disso: navegador (localStorage), com aviso. */
const S={despesas:[],extrato:[],perfil:{},plano:null,modo:"carregando",fase:"carregando",user:null};
let BK=null,AI=null,IMG=false,DL=null,AI_STATE="carregando",FB=null;
const LSKEY="prestacao-fapemat-v2";
const writeQ=new Map();
function setBadge(cls,txt){const b=$("#storeBadge");b.className="badge "+cls;b.textContent=txt}
function setStatus(kind,html){const el=$("#storeStatus");el.className="banner "+(kind||"info");el.innerHTML=html||"";el.hidden=!html}
function aplicarConfig(docs){
  const per=docs.find(d=>d.id==="perfil"),pl=docs.find(d=>d.id==="plano");
  S.perfil=per||{};
  if(pl&&pl.plano&&!validarPlano(pl.plano).length){if(S.plano!==pl.plano){S.plano=pl.plano;aplicarPlano(pl.plano)}}else S.plano=null;
}
const BK_LOCAL={
  nome:"local",
  load(){try{const raw=localStorage.getItem(LSKEY);if(raw){const o=JSON.parse(raw);S.despesas=o.despesas||[];S.extrato=o.extrato||[];aplicarConfig(o.config||[])}return true}catch(e){return false}},
  save(){try{localStorage.setItem(LSKEY,JSON.stringify({despesas:S.despesas,extrato:S.extrato,config:[Object.assign({},S.perfil,{id:"perfil"}),...(S.plano?[{id:"plano",plano:S.plano}]:[])]}));return true}catch(e){return false}},
  set(col,id,obj){
    if(col==="config"){const docs=[Object.assign({},S.perfil,{id:"perfil"}),...(S.plano?[{id:"plano",plano:S.plano}]:[])].filter(d=>d.id!==id);docs.push(obj);aplicarConfig(docs)}
    else{const a=S[col];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=obj;else a.push(obj)}
    this.save();atualizarFase();return Promise.resolve()},
  del(col,id){S[col]=S[col].filter(x=>x.id!==id);this.save();atualizarFase();return Promise.resolve()}
};
function startLocal(motivo){
  if(BK)return;
  BK=BK_LOCAL;const ok=BK.load()&&BK.save();S.modo=ok?"local":"memoria";
  setBadge(ok?"b-warn":"b-bad",ok?"Só neste navegador":"Sem salvar");
  setStatus(ok?"warn":"bad",(ok?"<b>Dados guardados só neste navegador.</b> ":"<b>Nada está sendo salvo.</b> ")+esc(motivo)+' Exporte o backup em <a href="#exportar">Exportar</a> com frequência.');
  atualizarFase();
}
function assinarColecoes(colRef,onErr){
  const got={despesas:false,extrato:false,config:false};
  const timer=setTimeout(()=>{if(S.fase==="carregando")setStatus("warn","O banco ainda não respondeu. Verifique a conexão; não cadastre em duplicidade.")},10000);
  const done=(k,fromCache)=>{got[k]=true;if(got.despesas&&got.extrato&&got.config){clearTimeout(timer);if(!fromCache)setStatus("","");atualizarFase()}};
  colRef("despesas").onSnapshot(s=>{S.despesas=s.docs.map(d=>d.data());done("despesas",s.metadata.fromCache);renderAll()},onErr);
  colRef("extrato").onSnapshot(s=>{S.extrato=s.docs.map(d=>d.data());done("extrato",s.metadata.fromCache);renderAll()},onErr);
  colRef("config").onSnapshot(s=>{aplicarConfig(s.docs.map(d=>Object.assign({id:d.id},d.data())));done("config",s.metadata.fromCache)},onErr);
}
function startClaudeDb(db){
  BK={nome:"claude",set:(col,id,obj)=>db.collection(col).doc(id).set(obj),del:(col,id)=>db.collection(col).doc(id).delete()};
  S.modo="claude";setBadge("b-ok","Salvo no Claude");
  assinarColecoes(c=>db.collection(c),e=>{setBadge("b-bad","Erro no banco");setStatus("bad","Erro no armazenamento ("+esc(e&&e.code)+"). Exporte o backup antes de continuar.")});
}
function carregarScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("falha ao carregar "+src));document.head.appendChild(s)})}
async function startFirebase(cfg){
  try{
    const base="https://www.gstatic.com/firebasejs/10.12.2/";
    await carregarScript(base+"firebase-app-compat.js");
    await Promise.all([carregarScript(base+"firebase-auth-compat.js"),carregarScript(base+"firebase-firestore-compat.js")]);
  }catch(e){startLocal("Não foi possível carregar o Firebase (sem internet?).");return}
  firebase.initializeApp(cfg);const auth=firebase.auth();const fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(_){}
  FB={auth,fs};
  auth.getRedirectResult().catch(e=>toast("Falha no login: "+(e&&e.code)));
  let unsub=[];
  auth.onAuthStateChanged(u=>{
    unsub.forEach(f=>f());unsub=[];
    if(!u){S.user=null;BK=null;S.despesas=[];S.extrato=[];S.plano=null;S.modo="login";S.fase="login";setBadge("b-gray","Desconectado");$("#sairBtn").hidden=true;setStatus("","");renderShell();return}
    S.user=u;$("#sairBtn").hidden=false;
    const col=c=>{const r=fs.collection("users").doc(u.uid).collection(c);return{onSnapshot:(a,b)=>{const f=r.onSnapshot(a,b);unsub.push(f);return f}}};
    const ref=c=>fs.collection("users").doc(u.uid).collection(c);
    BK={nome:"firebase",set:(c,id,obj)=>ref(c).doc(id).set(obj),del:(c,id)=>ref(c).doc(id).delete()};
    S.modo="firebase";S.fase="carregando";setBadge("b-ok","Salvo na nuvem");renderShell();
    assinarColecoes(col,e=>{setBadge("b-bad","Sem acesso");setStatus("bad",e&&e.code==="permission-denied"?"O Firestore negou acesso. Confira se as regras do arquivo firestore.rules foram publicadas no Firebase.":"Erro no banco ("+esc(e&&e.code)+").")});
  });
}
async function entrarGoogle(){
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await FB.auth.signInWithPopup(p)}catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))FB.auth.signInWithRedirect(p);else if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")toast("Falha no login: "+(e.code||e.message))}
}
function persist(col,obj){
  obj=JSON.parse(JSON.stringify(obj));
  if(!BK)return Promise.reject(new Error("sem armazenamento"));
  if(BK.nome==="local")return BK.set(col,obj.id,obj);
  const key=col+"/"+obj.id;const prev=writeQ.get(key)||Promise.resolve();
  const p=prev.then(()=>BK.set(col,obj.id,obj)).catch(e=>{toast("Não foi possível salvar ("+(e&&e.code||"erro")+").");throw e});
  writeQ.set(key,p.catch(()=>{}));return p;
}
function remove(col,id){if(!BK)return Promise.reject();return Promise.resolve(BK.del(col,id)).catch(e=>{toast("Não foi possível excluir ("+(e&&e.code)+").");throw e})}
function atualizarFase(){if(BK&&S.fase!=="login")S.fase=S.plano?"ok":"semplano";renderShell()}

/* ================= NOMES E EQUIPE ================= */
const PART=new Set(["da","de","do","das","dos","e"]);
const toks=n=>norm(n).split(" ").filter(t=>t&&!PART.has(t));
const isCoord=n=>{const c=toks(PROJ.coord),t=toks(n);return c.length>1&&t.includes(c[0])&&t.includes(c[1])};
function membroEquipe(nome){
  const f=toks(nome);if(f.length<2)return null;
  for(const m of EQUIPE){const t=toks(m);if(norm(m)===norm(nome)||(f[0]===t[0]&&f[f.length-1]===t[t.length-1]))return m}
  return null;
}
function sobrenomeComum(nome){
  const f=toks(nome).slice(1).filter(x=>x.length>2);
  for(const m of EQUIPE){const t=toks(m).slice(1);const c=f.find(x=>t.includes(x));if(c)return{membro:m,sobrenome:c}}
  return null;
}

function docsDe(d,t){return(d.documentos||[]).filter(x=>x.tipo===t)}
function linhasDe(d){return S.extrato.filter(l=>l.despesaId===d.id)}
function prepararCtx(){
  const excesso=new Map(),porItem={};
  for(const d of S.despesas){if(d.itemId&&ITEM[d.itemId]&&d.valorCentavos!=null)(porItem[d.itemId]=porItem[d.itemId]||[]).push(d)}

function avaliar(d,ctx){

  const T=TIPOS[d.tipo];const item=ITEM[d.itemId];const disp=d.dispensas||{};

  const cinza=(cod,msg,norma,acao,dispensavel)=>{if(dispensavel&&disp[cod]){R.infos.push({cod,msg:"Alerta dispensado por você: "+msg,just:disp[cod].justificativa});return}if(d.autorizacaoFapemat){R.infos.push({cod,msg:"Confirmado com a FAPEMAT: "+msg,just:d.autorizacaoFapemat});return}R.cinzas.push({cod,msg,norma,acao,dispensavel})};
  if(!d.data)R.campos.push("data");

  if(d.data&&(d.data<PROJ.vigIni||d.data>PROJ.vigFim))err("vig",`Data ${fmtData(d.data)} fora da vigência (${vig()}).`,"Item 3.13 b","Despesa fora da vigência não é aceita. Se a data está errada, corrija. Se está certa, não use recurso do projeto; se já usou, prepare a devolução.");
  const txt=norm([d.descricao,...(d.documentos||[]).map(x=>x.campos&&x.campos.descricaoItens)].filter(Boolean).join(" "));
  const limiteRem=PRAZOS.find(p=>/remanej/i.test(p[1]));
  if(T&&d.tipo!=="taxa_bancaria"){
    if(!item)err("semitem","Despesa sem item correspondente no orçamento aprovado.","Itens 3.1 e 3.14","Escolha o item certo no orçamento. Se não existir, não gaste: peça remanejamento à FAPEMAT antes"+(limiteRem?` (limite ${fmtData(limiteRem[0])})`:"")+".");
    else{
      const natI=RUB[item.rubrica]?RUB[item.rubrica].natureza:"custeio";
      if(natI!==T.natureza)err("cap",T.natureza==="capital"?`Despesa de capital (${T.nome.toLowerCase()}) lançada em item de custeio (${item.nome}).`:`Despesa de custeio lançada em item de capital (${item.nome}).`,"Item 3.2","Saldo de custeio não paga capital, nem o contrário. Lance no item da natureza certa ou peça remanejamento.");
      else if(T.rubrica!==item.rubrica)err("rub",`Tipo "${T.nome}" não corresponde à rubrica do item (${RUB[item.rubrica]?RUB[item.rubrica].nome:item.rubrica}).`,"Item 3.1","Escolha um item da rubrica correta.");
      const ex=ctx.excesso.get(d.id);
      if(ex)err("saldo",`Ultrapassa o saldo do item "${item.nome}" em ${brl(ex)}.`,"Itens 3.1 e 3.14","Reduza o valor ou peça remanejamento à FAPEMAT antes de gastar.");
      if(item.generica)cinza("generica",`Lançada na linha genérica de material de consumo (${brl(item.total)}), que não especifica os materiais.`,"Item 3.1","Pergunte à FAPEMAT se este material é aceito nessa linha e guarde a resposta por escrito.");
    }
  }
  if(d.tipo==="taxa_bancaria"){
    if(!RX.tarifa.test(txt))err("taxa","Lançada como taxa bancária, mas a descrição não indica tarifa da conta do projeto.","Itens 3.12 e 3.13 e","Se não for tarifa bancária da conta do projeto, mude o tipo.",true);
    cinza("taxasemitem","Taxa bancária da conta do projeto é permitida, mas o orçamento aprovado não tem item para ela.","Item 3.12","Confirme com a FAPEMAT de qual rubrica a tarifa deve sair.");
  }
  if(d.tipo==="consumo"&&item){const kw=RX.perm.find(k=>txt.includes(k)&&!norm(item.nome).includes(k));if(kw)cinza("perm",`"${kw}" parece material permanente lançado em consumo.`,"Item 3.2","Confirme com a FAPEMAT. Se for permanente, relance em equipamentos.",true)}
  if(d.tipo==="diaria"){

      const esperado=Math.round(d.quantidade*item.unit);
      if(esperado!==d.valorCentavos)err("diariavalor",`Valor não confere: ${brl(d.valorCentavos)} para ${fmtQtd(d.quantidade)} diária(s) a ${item.destino||item.nome}; o correto é ${brl(esperado)} (${brl(item.unit)} por diária).`,"Item 3.6",`Diária vale ${brl(PROJ.diariaDentro)} em ${PROJ.uf} e ${brl(PROJ.diariaFora)} fora de ${PROJ.uf}. Corrija o valor pago ou a quantidade.`);
    }
    if(d.quantidade>0&&!Number.isInteger(d.quantidade))cinza("fracionada",`Diária fracionada (${fmtQtd(d.quantidade)}).`,"Item 3.6","Confirme com a FAPEMAT como pagar e comprovar a fração.");

  }
  if(d.tipo!=="diaria"&&RX.alim.test(txt))err("alim","Alimentação, coffee break, coquetel, ornamentação ou show.","Item 3.13 h","Despesa vedada. Não pague com recurso do projeto.",true);
  if(RX.multa.test(txt))err("multa","Multa, juros, correção monetária ou taxa de remarcação ou cancelamento.","Item 3.13 f e j","Vedado. Pague com recurso próprio.",true);
  if(d.tipo!=="taxa_bancaria"&&RX.admin.test(txt))err("admin","Luz, água, telefone ou despesa administrativa.","Itens 3.12 e 3.13 e","Vedado. Se for tarifa da conta do projeto, mude o tipo para Taxa bancária.",true);
  if(d.tipo!=="taxa_bancaria"&&RX.tarifa.test(txt)&&!RX.admin.test(txt))R.infos.push({msg:"A descrição parece tarifa bancária. Se for da conta do projeto, mude o tipo para Taxa bancária."});
  if(RX.obra.test(txt))err("obra","Obra de construção civil.","Item 3.13 g","Vedado.",true);
  if(T&&T.servico&&RX.revisao.test(txt))err("revisao","Serviço de revisão ou tradução de texto, análise de dados ou elaboração de relatório.","Item 3.13 l","Vedado. Esse trabalho não pode ser pago pelo projeto.",true);
  if(T&&T.servico&&d.favorecido){
    const m=membroEquipe(d.favorecido);
    if(m)err("equipe",`${d.favorecido} é ${isCoord(m)?"o coordenador":"membro da equipe"} e não pode receber por serviço.`,"Item 3.13 c e d","Contrate outra pessoa. Se já pagou, a despesa será glosada.");
    else{const s=sobrenomeComum(d.favorecido);
      if(s){const p=d.parentesco;
        if(!p||p.fav!==norm(d.favorecido))R.perguntas.push({cod:"parentesco",membro:s.membro,sobrenome:s.sobrenome});
        else if(p.resposta==="sim")err("parente",`Favorecido declarado cônjuge ou parente até 3º grau de ${s.membro}.`,"Item 3.13 c e d","Não pague. Contrate outra pessoa.");
      }}
  }
  if(d.pagamentoMultiplo)err("multi","Um mesmo pagamento cobre mais de uma despesa.","Item 3.4.1","Cada despesa precisa de pagamento próprio. Peça documentos separados ou refaça o pagamento.");
  if(d.formaPagamento==="saque"&&!(d.justificativaSaque||"").trim())err("saque","Saque em dinheiro sem justificativa.","Item 3.4.1","Registre a justificativa do saque ou pague por transferência.");
  for(const l of linhasDe(d)){if(d.valorCentavos!=null&&l.valorCentavos>d.valorCentavos)err("multi-ext",`O débito do extrato de ${fmtData(l.data)} (${brl(l.valorCentavos)}) é maior que a despesa (${brl(d.valorCentavos)}): parece pagar mais de uma despesa.`,"Item 3.4.1","Confira a conciliação. Cada pagamento deve corresponder a uma única despesa.")}
  if(T){
    for(const t of T.docs){if(t==="extrato"){if(!linhasDe(d).length)R.faltas.push(t);continue}if(!docsDe(d,t).length)R.faltas.push(t)}

}
function calcular(){

  const cont={pendente:0,comprovada:0,irregular:0,fapemat:0};

}

const GENERICAS=new Set(["material","materiais","consumo","linha","generica","especificacao","diversos","para","com","sem","servico","servicos","pessoa","fisica","juridica","passagem","diarias"]);
function lerTextoLocal(txt){
  const n=norm(txt);
  const RXD=/(?<![\d.,])\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?(?![\d,])/;

  else if((m=semDatas.match(/\b(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+,\d{1,2})\b/)))valor=m[1];
  else{const nums=[...semDatas.matchAll(/\b(\d{2,})\b/g)].map(x=>x[1]).filter(x=>!/^20\d\d$/.test(x));if(nums.length===1)valor=nums[0]}
  const dm=txt.match(RXD)||txt.match(/\d{1,2}\s+de\s+[a-zç]+(?:\s+de\s+\d{4})?/i);
  const qm=n.match(/(\d+(?:[.,]\d+)?)\s*diarias?/);
  let tipo=null;
  if(/diaria/.test(n))tipo="diaria";else if(/passage|bilhete|aere/.test(n))tipo="passagem";else if(RX.tarifa.test(n))tipo="taxa_bancaria";
  let item=null,melhor=0;
  for(const i of ITENS){
    if(tipo==="diaria"&&i.rubrica!=="diarias")continue;
    if(tipo==="passagem"&&i.rubrica!=="passagens")continue;
    if(tipo!=="diaria"&&tipo!=="passagem"&&(i.rubrica==="diarias"||i.rubrica==="passagens"))continue;
    let sc=0;
    if(i.destino&&n.includes(norm(i.destino)))sc+=3;
    if(tipo!=="diaria"&&tipo!=="passagem")toks(i.nome).filter(t=>t.length>3&&!GENERICAS.has(t)).forEach(t=>{const raiz=t.slice(0,Math.max(4,t.length-2));if(n.includes(raiz))sc+=1});
    if(sc>melhor){melhor=sc;item=i}
  }
  if(item&&!tipo)tipo={diarias:"diaria",passagens:"passagem",consumo:"consumo",servpf:"servico_pf",servpj:"servico_pj",equip:"equipamento"}[item.rubrica]||null;

DOCUMENTOS EXIGIDOS: material de consumo e serviço PJ: nota fiscal + comprovante de pagamento. Serviço PF: Recibo de Serviços de Terceiros Pessoa Física + comprovante. Diária: Recibo de Diária + comprovante. Passagem aérea: bilhete eletrônico, fatura da agência ou companhia e comprovante de embarque. Equipamento: nota fiscal, comprovante e termo de incorporação ao patrimônio. Recomendado (não obrigatório): três orçamentos para equipamentos e serviços.`;

function viewAssist(){
  if(!AI)return `<section class="block"><h2>Assistente</h2><div class="empty"><b>O assistente usa o Claude</b><span>${AI_STATE==="carregando"?"Carregando o Claude…":"Fora do Claude não há IA disponível. Saldos, validações e alertas continuam funcionando aqui."}</span></div></section>`;
  return `<section class="block"><div class="sec-head"><h2>Assistente</h2><span class="hint">responde com base no orçamento, nos saldos e nas regras; não grava nada</span></div>
  <div class="chat" id="chatLog">${chat.length?chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join(""):`<div class="empty"><b>Pergunte, por exemplo:</b><div class="row">${["Posso comprar uma impressora?","Posso pagar o almoço da equipe em campo?","Quanto ainda tenho de diárias?"].map(q=>`<button class="btn sm" data-act="perg" data-v="${esc(q)}">${esc(q)}</button>`).join("")}</div></div>`}
  ${chatBusy?`<div class="msg a" id="chatPend"><span class="spinner"></span> Pensando…</div>`:""}</div>
  <div class="composer"><textarea id="chatIn" class="f" rows="2" placeholder="Posso gastar com…?" aria-label="Pergunta"></textarea>
  ${chatBusy?`<button class="btn" data-act="chatstop">Parar</button>`:`<button class="btn primary" data-act="chatsend">Enviar</button>`}</div>
  ${chat.length?`<button class="linkbtn small" data-act="chatlimpar" style="align-self:flex-start">Limpar conversa</button>`:""}</section>`;

async function enviarChat(){
  const inp=$("#chatIn");const q=inp&&inp.value.trim();if(!q||!AI||chatBusy)return;
  const C=calcular();chat.push({role:"user",content:q});chatBusy=true;chatCtl=new AbortController();renderView();
  try{const {text}=await AI([{role:"user",content:contextoAssistente(C)},...chat.slice(-12)],{cache:false,signal:chatCtl.signal,onText:({text})=>{const p=$("#chatPend");if(p)p.textContent=text}});chat.push({role:"assistant",content:text})}
  catch(e){if(e&&e.code!=="cancelled")chat.push({role:"assistant",content:(e.text?e.text+"\n\n":"")+"["+msgErro(e)+"]"});else if(e&&e.text)chat.push({role:"assistant",content:e.text+" [interrompido]"})}
  chatBusy=false;renderView();
}

function csvCell(v){v=v==null?"":String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function gerarCSV(){
  const C=calcular();
  const linhas=[["Natureza","Rubrica","Item do orçamento","Data","Favorecido","CPF/CNPJ","Documento fiscal","Nº do documento","Data do documento","Descrição","Forma de pagamento","Valor (R$)","Estado","Pendências","Alertas","Justificativas registradas"]];
  const grupos={};
  for(const d of S.despesas){const it=ITEM[d.itemId];const rub=it?it.rubrica:(TIPOS[d.tipo]&&TIPOS[d.tipo].rubrica)||"sem";(grupos[rub]=grupos[rub]||[]).push(d)}
  const ordem=[...RUBRICAS.filter(r=>r.natureza!=="capital").map(r=>r.id),"sem",...RUBRICAS.filter(r=>r.natureza==="capital").map(r=>r.id)];
  for(const rid of ordem){
    const arr=(grupos[rid]||[]).sort((a,b)=>(a.data||"9").localeCompare(b.data||"9"));if(!arr.length)continue;
    const nat=rid==="sem"?"Custeio":RUB[rid].natureza==="capital"?"Capital":"Custeio";const rn=rid==="sem"?"Sem rubrica":RUB[rid].nome;let sub=0;
    for(const d of arr){
      const a=C.av.get(d.id);const fiscal=(d.documentos||[]).find(x=>["nf","recibo_pf","recibo_diaria","bilhete","fatura"].includes(x.tipo));sub+=d.valorCentavos||0;
      linhas.push([nat,rn,ITEM[d.itemId]?ITEM[d.itemId].nome:"",d.data?fmtData(d.data):"",d.favorecido,d.docFavorecido,fiscal?DOCS[fiscal.tipo]:"",fiscal&&fiscal.campos?fiscal.campos.numero:"",fiscal&&fiscal.campos&&fiscal.campos.data?fmtData(fiscal.campos.data):"",d.descricao,FORMAS[d.formaPagamento]||"",numBR(d.valorCentavos),ESTADOS[a.estado],[...a.campos.map(c=>"preencher "+c),...a.faltas.map(t=>DOCS[t])].join(" | "),[...a.erros,...a.cinzas].map(e=>`${e.norma}: ${e.msg}`).join(" | "),[...Object.entries(d.dispensas||{}).map(([k,v])=>`${k}: ${v.justificativa}`),d.autorizacaoFapemat?"FAPEMAT: "+d.autorizacaoFapemat:"",d.justificativaSaque?"Saque: "+d.justificativaSaque:""].filter(Boolean).join(" | ")]);
    }
    linhas.push(["","Subtotal "+rn,"","","","","","","","","",numBR(sub),"","","",""]);
  }
  linhas.push(["","Total geral","","","","","","","","","",numBR(S.despesas.reduce((s,d)=>s+(d.valorCentavos||0),0)),"","","",""]);
  return "﻿"+`Processo;${csvCell(PROJ.processo)}\nProjeto;${csvCell(PROJ.nome)}\nCoordenador;${csvCell(PROJ.coord)}\nGerado em;${fmtData(hojeISO())}\n\n`+linhas.map(l=>l.map(csvCell).join(";")).join("\r\n");
}
function gerarJSON(){return JSON.stringify({app:"prestacao-fapemat",versao:2,exportadoEm:new Date().toISOString(),despesas:S.despesas,extrato:S.extrato,perfil:S.perfil,plano:S.plano},null,2)}
function baixarNavegador(nome,conteudo){try{const url=URL.createObjectURL(new Blob([conteudo],{type:nome.endsWith(".csv")?"text/csv;charset=utf-8":"application/json"}));const a=document.createElement("a");a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);return true}catch(e){return false}}
async function baixar(nome,conteudo){
  if(DL){try{await DL.save({filename:nome,data:conteudo});toast("Arquivo salvo.");return}catch(e){if(e&&e.code==="declined")return}}
  else if(S.modo!=="claude"&&baixarNavegador(nome,conteudo)){toast("Download iniciado.");return}
  const box=$("#saida");if(box){box.hidden=false;$("#saidaTxt").value=conteudo;toast("Copie o conteúdo abaixo.")}
}
async function importar(){
  const msg=$("#impMsg");let txt=$("#impTxt").value.trim();const f=$("#impFile").files[0];
  if(!txt&&f)txt=await f.text();
  if(!txt){msg.textContent="Escolha um arquivo ou cole o JSON.";return}
  let o;try{o=JSON.parse(txt)}catch(e){msg.textContent="O conteúdo não é um JSON válido.";return}
  if(!o||!Array.isArray(o.despesas)){msg.textContent="Este JSON não é um backup deste app.";return}
  const modo=(document.querySelector('[name="impModo"]:checked')||{}).value;
  if(modo==="substituir"&&!importar.ok){importar.ok=true;msg.innerHTML='<b style="color:var(--bad)">Isto apaga as despesas atuais que não estão no backup. Clique Importar de novo para confirmar.</b>';return}
  importar.ok=false;msg.textContent="Importando…";
  try{
    if(modo==="substituir"){const ids=new Set(o.despesas.map(d=>d.id)),eids=new Set((o.extrato||[]).map(l=>l.id));for(const d of[...S.despesas])if(!ids.has(d.id))await remove("despesas",d.id);for(const l of[...S.extrato])if(!eids.has(l.id))await remove("extrato",l.id)}
    for(const d of o.despesas)if(d&&d.id)await persist("despesas",d);
    for(const l of(o.extrato||[]))if(l&&l.id)await persist("extrato",l);
    if(o.perfil)await persist("config",Object.assign({},o.perfil,{id:"perfil"}));
    if(o.plano&&!validarPlano(o.plano).length)await persist("config",{id:"plano",plano:o.plano});
    msg.textContent=`Importado: ${o.despesas.length} despesa(s), ${(o.extrato||[]).length} linha(s) de extrato.`;
  }catch(e){msg.textContent="A importação parou no meio. Confira e importe de novo."}
}

async function salvarPlano(){
  const msg=$("#planoMsg");let txt=$("#planoTxt").value.trim();const f=$("#planoFile").files[0];
  if(!txt&&f)txt=await f.text();
  if(!txt){msg.textContent="Escolha o arquivo.";return}
  let o;try{o=JSON.parse(txt)}catch(e){msg.textContent="Arquivo não é JSON válido.";return}
  if(o&&o.plano&&Array.isArray(o.despesas))o=o.plano;
  const e=validarPlano(o);if(e.length){msg.textContent="Plano inválido: "+e.slice(0,3).join("; ");return}
  msg.textContent="Salvando…";
  try{await persist("config",{id:"plano",plano:o});msg.textContent="Plano salvo."}catch(_){msg.textContent="Não foi possível salvar."}
}

  $("#view").innerHTML=S.fase==="login"?viewLogin():S.fase==="semplano"?(TAB==="exportar"?viewExport():viewSemPlano()):`<div class="empty"><span><span class="spinner"></span> Carregando seus dados…</span></div>`;

    case"filtrar":UI.filtroEstado=b.dataset.v;location.hash="#lancamentos";break;

    case"salvar":if(desp){const f=document.querySelector(`.editform[data-id="${id}"]`);const v=lerDespesa(f);const fa=document.querySelector(`[data-fapemat="${id}"]`);const m=Object.assign({},desp,v,{atualizadoEm:new Date().toISOString()});if(fa)m.autorizacaoFapemat=fa.value.trim();await persist("despesas",m);toast("Alterações salvas.")}break;

function abrirManual(despId,tipo){
  const d=S.despesas.find(x=>x.id===despId);
  drafts.unshift({id:uid(),kind:"manual",status:"pronto",editando:true,tipoDoc:tipo,arquivo:null,campos:{numero:"",data:"",valorCentavos:null,emitente:"",emitenteDoc:"",destinatarioNome:"",destinatarioCpf:"",processoTexto:"",descricaoItens:""},cands:d?[{d,sc:100}]:[],vinculo:despId||"nova"});
  renderDrafts();window.scrollTo({top:0,behavior:"smooth"});
}
